name: Test kit

# Every push runs the Quick kit: build, load, old plan files, every shipped feature, every function (Search commands,
# shortcuts in both key sets, right-click entries, settings), random input with injected faults, screenshots, speed, deploy.
# The report page, failure pictures and last.json are attached to the run as the "kit-report" artifact.
# From the Actions tab the Standard or Full kit can be run on one machine; the release gate (gate.yml) runs the full gate split across machines.
on:
  push:
  workflow_dispatch:
    inputs:
      kit:
        description: Which kit
        type: choice
        options: [quick, standard, full]
        default: quick

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # screenshots made on GitHub differ from local ones (fonts); they are compared with their own baseline, kept in the artifact
      SB_BASELINE: test/release/baseline-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run the ${{ inputs.kit || 'quick' }} kit
        run: node test/release/kit.mjs ${{ inputs.kit || 'quick' }}
      - name: Summary
        if: always()
        run: |
          mkdir -p results/result-${{ inputs.kit || 'quick' }}-kit
          cp test/release/out/last.json results/result-${{ inputs.kit || 'quick' }}-kit/ 2>/dev/null || true
          node test/release/ci-summary.mjs results >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The full report (report.html, with a picture of each failure) is in the kit-report artifact." >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-report
          path: |
            test/release/out/
            test/release/baseline-ci/
          if-no-files-found: ignore
